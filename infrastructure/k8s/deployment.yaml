apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pool-api
  template:
    metadata:
      labels:
        app: pool-api
    spec:
      containers:
        - name: api
          image: ghcr.io/ektorg89/ektor-pool-services/api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: pool-api-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
